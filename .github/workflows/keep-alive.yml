name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP GET to Render Backend
        run: |
          curl --fail --retry 3 --retry-delay 10 https://tikram-backend.onrender.com/
          echo "Ping Success"

